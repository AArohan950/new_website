            <h1>Register</h1>
            <fieldset>
                <legend>Registration Form</legend>
                <form action="submit_registration.php" method="post">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" 
                placeholder="Enter your name" required ><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" 
                placeholder="Enter your email"  required><br><br>

                <label for="event">Select Event:</label><br>
                <select id="event" name="event" required>
                    <option value="">--Please choose an event--</option>
                    <option value="code_competition">Code Competition</option>
                    <option value="web_design_challenge">Web Design Challenge</option>
                </select><br><br>
                <label for="Comments">Message:</label>
                <textarea id="message" name="message" rows="4" cols="50"
                placeholder="Enter any additional information"></textarea>

                <button type="submit">submit</button>

                

            </form>
            </fieldset>
        </section>
